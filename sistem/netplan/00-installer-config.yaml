# This is the network config written by 'subiquity'
network:
  ethernets:
    enp37s0:
      dhcp4: false
      addresses:
        - <IP>/24
      routes:
        - to: default
          via: <IP>
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
      match:
        macaddress: <IPv6>
      set-name: enp37s0
  version: 2

